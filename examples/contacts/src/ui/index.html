<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>交往簿</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f2;
        --panel: #fff;
        --ink: #1d211f;
        --muted: #626c64;
        --line: #dfe2dc;
        --green: #2f6b4f;
        --on: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 760px;
        margin: auto;
        padding: 24px 20px 40px;
      }
      h1 {
        font-size: 32px;
        margin: 0;
        letter-spacing: -1px;
      }
      h2 {
        font-size: 24px;
        margin: 12px 0;
      }
      h3 {
        font-size: 18px;
      }
      p {
        margin: 10px 0;
      }
      button,
      input,
      select {
        font: inherit;
        min-height: 48px;
        border-radius: 8px;
        border: 1px solid var(--line);
        padding: 10px 14px;
        background: var(--panel);
        color: var(--ink);
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--green);
        outline-offset: 2px;
      }
      .primary {
        background: var(--green);
        color: var(--on);
        border-color: var(--green);
      }
      .muted,
      small {
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .row input {
        min-width: 0;
        flex: 1;
      }
      .section {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .person {
        display: block;
        text-align: left;
        width: 100%;
        border-radius: 0;
        border-width: 0 0 1px;
        background: transparent;
        padding: 16px 0;
      }
      .person strong {
        display: block;
        font-size: 20px;
      }
      .entry {
        padding: 12px 0 12px 16px;
        border-left: 2px solid var(--line);
        margin: 12px 0;
      }
      .source {
        font-size: 14px;
        min-height: 44px;
      }
      .notice {
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        margin: 16px 0;
        white-space: pre-wrap;
      }
      .source-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .empty {
        padding: 32px 0;
      }
      #status {
        min-height: 26px;
      }
      button .muted {
        color: inherit;
      }
      [hidden] {
        display: none !important;
      }
      .hidden {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151b17;
          --panel: #202923;
          --ink: #edf2ed;
          --muted: #b0bdb2;
          --line: #3d4a40;
          --green: #a3d6b6;
          --on: #163b26;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>交往簿</h1>
        <p>把已有的交往记录，整理成可以回看的关系与约定。</p>
      </header>
      <div class="row">
        <button id="request" class="primary">选择资料并整理</button><button id="cancel" hidden>取消请求</button
        ><button id="clear">撤销并清除</button>
      </div>
      <p id="status" role="status" aria-live="polite">资料只在本次打开期间保留。首次使用需要你选择允许的资料范围。</p>
      <p id="updated" class="muted"></p>
      <div id="notices"></div>
      <div id="filters" class="row section" hidden>
        <input id="search" type="search" aria-label="搜索人物或谈话" placeholder="搜索人物、谈话或约定" /><select
          id="group"
          aria-label="按分组查看">
          <option value="">所有分组</option>
        </select>
      </div>
      <section id="list">
        <p class="empty muted">你的记录，由你决定如何使用。<br />先请求资料，再开始查看联系人。</p>
      </section>
      <section id="detail" hidden></section>
      <section id="source" hidden></section>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
