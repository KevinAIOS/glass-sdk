<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'" />
    <title>AIOS Reference</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #f4f5f2;
        --ink: #1d211f;
        --muted: #626c64;
        --line: #dfe2dc;
        --primary: #2f6b4f;
        --on-primary: #fff;
        --error: #9b413d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #151b17;
          --ink: #edf2ed;
          --muted: #b0bdb2;
          --line: #3d4a40;
          --primary: #a3d6b6;
          --on-primary: #163b26;
          --error: #ffb4ab;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font: 17px/1.65 system-ui, sans-serif;
      }
      main {
        max-width: 600px;
        padding: 32px 24px;
        margin: auto;
      }
      h1 {
        font-size: 28px;
        line-height: 1.3;
        margin: 0 0 16px;
        text-wrap: balance;
      }
      p {
        margin: 12px 0;
        color: var(--muted);
      }
      section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      #count {
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        font-weight: 600;
      }
      button {
        font: inherit;
        min-height: 48px;
        width: 100%;
        margin-top: 16px;
        padding: 12px 20px;
        background: var(--primary);
        color: var(--on-primary);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.93);
      }
      button:active {
        filter: brightness(0.85);
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 4px;
      }
      #error {
        color: var(--error);
      }
      ::selection {
        background: var(--primary);
        color: var(--on-primary);
      }
    </style>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main>
      <h1>我的第一个 AIOS 应用</h1>
      <p id="status" role="status">请从 AIOS 打开此应用，正在等待本机连接。</p>
      <section aria-label="本地记录">
        <p>点击下方按钮，保存一条本地计数。</p>
        <p id="count" aria-live="polite">正在读取记录…</p>
        <button id="increment" disabled>记录一次</button>
        <p id="error" role="alert"></p>
      </section>
      <p>此示例无需连接眼镜，也不会上传数据。</p>
    </main>
  </body>
</html>
